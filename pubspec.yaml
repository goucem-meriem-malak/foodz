name: foodz
description: Food ordering and delivery system for Algerian restaurants (client, admin, owner, chef, delivery).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_messaging: ^16.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  http: ^1.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.2

# image 4.11 does not compile against the archive versions pub picks (decodeLazy).
# 4.5.4 is the last known good version; it is only used by the PDF/print packages.
dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/logo.png
    - assets/legal/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon_full.png
  adaptive_icon_background: "#0B0707"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 23
  web:
    generate: true
    image_path: assets/brand/icon_full.png
    background_color: "#FFF7F5"
    theme_color: "#DC0A22"
  windows:
    generate: true
    image_path: assets/brand/icon_full.png
    icon_size: 256

flutter_native_splash:
  color: "#FFF7F5"
  color_dark: "#0E0A0A"
  image: assets/brand/splash_logo.png
  android_12:
    color: "#FFF7F5"
    color_dark: "#0E0A0A"
    image: assets/brand/splash_android12.png
  web: false
